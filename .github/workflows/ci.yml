name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@814649735835a84a3d0d6c8d6e6db87dfeb8b348 # v6.0.2

      - name: Setup uv
        uses: astral-sh/setup-uv@814649735835a84a3d0d6c8d6e6db87dfeb8b348 # v7.3.0

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .
