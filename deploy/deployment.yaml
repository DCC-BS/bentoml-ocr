apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm-ocr-proxy
  namespace: bentoml-ocr
  labels:
    app.kubernetes.io/name: glm-ocr-proxy
    app.kubernetes.io/part-of: bentoml-ocr
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: glm-ocr-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glm-ocr-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: proxy
          image: ghcr.io/dcc-bs/bentoml-ocr:latest  # replace OWNER and pin to a release tag
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: glm-ocr-proxy-secrets
          env:
            - name: IS_PROD
              value: "true"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
