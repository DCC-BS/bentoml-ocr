apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: glm-ocr-proxy
  labels:
    app.kubernetes.io/name: glm-ocr-proxy
    app.kubernetes.io/part-of: bentoml-ocr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: glm-ocr-proxy
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
