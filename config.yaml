# GLM-OCR configuration for BentoML proxy service.
# Override runtime values with environment variables where needed.

server:
  host: "0.0.0.0"
  port: 5002
  debug: false

logging:
  level: INFO

pipeline:
  maas:
    enabled: false

  ocr_api:
    # api_host, api_port, model, api_url, and api_key are provided at runtime
    # via AppConfig (env vars VLLM_API_URL, VLLM_MODEL_NAME, VLLM_API_KEY).
    api_host: null
    api_port: null
    model: null
    api_path: /v1/chat/completions
    api_url: null
    api_mode: openai
    api_key: null
    headers: {}
    verify_ssl: false
    connect_timeout: 30
    request_timeout: 300
    retry_max_attempts: 2
    retry_backoff_base_seconds: 0.5
    retry_backoff_max_seconds: 8.0
    retry_jitter_ratio: 0.2
    retry_status_codes: [429, 500, 502, 503, 504]
    connection_pool_size: 128

  max_workers: 16
  page_maxsize: 100
  region_maxsize: 800

  page_loader:
    max_tokens: 4096
    temperature: 0.0
    top_p: 0.9
    top_k: 50
    repetition_penalty: 1.1
    image_format: JPEG
    min_pixels: 12544
    max_pixels: 71372800
    default_prompt: >
      Recognize all text in the image and output Markdown preserving layout.
    task_prompt_mapping:
      text: "Text Recognition:"
      table: "Table Recognition:"
      formula: "Formula Recognition:"
    pdf_dpi: 200
    pdf_max_pages: null
    pdf_verbose: false

  result_formatter:
    filter_nested: true
    min_overlap_ratio: 0.8
    output_format: both
    label_visualization_mapping:
      table: [table]
      formula: [display_formula, inline_formula]
      image: [chart, image]
      text:
        - abstract
        - algorithm
        - content
        - doc_title
        - figure_title
        - paragraph_title
        - reference_content
        - text
        - vertical_text
        - vision_footnote
        - seal
        - formula_number

  enable_layout: true

  layout:
    model_dir: PaddlePaddle/PP-DocLayoutV3_safetensors
    threshold: 0.3
    batch_size: 1
    workers: 1
    cuda_visible_devices: "0"
    layout_nms: true
    layout_unclip_ratio: [1.0, 1.0]
